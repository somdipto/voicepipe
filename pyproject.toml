[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicepipe"
version = "1.1.0"
description = "Offline-first STT and TTS for agents. Whisper + edge-tts, zero config."
readme = "README.md"
license = "MIT"
authors = [
    { name = "DanLab", email = "dan@danlab.dev" },
]
keywords = ["stt", "tts", "speech", "whisper", "voice", "audio", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Full build — everything in one shot
build = [
    "sounddevice",
    "numpy",
    "edge-tts>=7.0.0",
    "gtts",
    "pyttsx3",
    "espeak-ng",
    "faster-whisper",
]
# STT extras
stt = [
    "sounddevice",
    "numpy",
    "faster-whisper",
]
# TTS extras
tts = [
    "edge-tts>=7.0.0",
    "gtts",
    "pyttsx3",
]
# Agent support
agent = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
# Full dev install
dev = [
    "voicepipe[build,agent]",
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
voicepipe = "voicepipe.cli:app"

[project.urls]
Homepage = "https://github.com/somdipto/voicepipe"
Repository = "https://github.com/somdipto/voicepipe"
Documentation = "https://github.com/somdipto/voicepipe#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/voicepipe"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
