[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepipe"
version = "0.1.0"
description = "One-command STT + TTS for any app"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DanLab", email = "dan@danlab.dev"},
]
keywords = ["stt", "tts", "speech", "voice", "whisper", "kittentts", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
kittentts = ["kittentts"]
gtts = ["gtts"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/danlab-ai/voicepipe"
Documentation = "https://voicepipe.readthedocs.io"
Repository = "https://github.com/danlab-ai/voicepipe"
Issues = "https://github.com/danlab-ai/voicepipe/issues"

[project.scripts]
voicepipe = "voicepipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicepipe = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false