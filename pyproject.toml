[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepipe"
version = "0.4.0"
description = "One-command voice STT + TTS for any app"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DanLab", email = "dan@danlab.dev"},
]
keywords = ["stt", "tts", "speech", "voice", "whisper", "ai", "voice-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# Full installation (includes agent)
agent = ["gtts", "edge-tts", "pyttsx3"]
# Default
default = ["gtts"]
# All TTS backends
full = ["gtts", "edge-tts", "pyttsx3"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/danlab-ai/voicepipe"
Repository = "https://github.com/danlab-ai/voicepipe"
Issues = "https://github.com/danlab-ai/voicepipe/issues"

[project.scripts]
voicepipe = "voicepipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"